[package]
name = "surco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Surco: a native music player drawn with limn."

[lib]
name = "surco_app"
crate-type = ["rlib", "staticlib"]

[dependencies]
surco-core = { path = "../core" }
limn = { path = "../../../lienzo/crates/limn", default-features = false }
limn-egui = { path = "../../../lienzo/crates/limn-egui", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence", "links"] }
# Saves the frame for `--screenshot`, and reads a cover's colors for the tint of its card.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
fastrand = "2"
surco-audio = { path = "../audio" }
surco-youtube = { path = "../youtube" }
surco-video = { path = "../video" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
# A cover reaches limn as base64 with its digest.
sha2 = "0.10"
# Already in the tree: the code Spotify's web player proves itself with, for a long playlist.
sha1 = "0.10"
# The index of what is kept for offline listening.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hour of the day, for the greeting. Already in the tree through the catalog.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# Both already in the tree through the HTTP client: a playlist's name inside its link, and
# its tracks fetched side by side when one is opened.
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# MIT/Apache-2.0. The words of the interface, in Spanish and English: Mozilla's Fluent,
# with its plurals; the language the system speaks picks the first one.
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
# MIT/Apache-2.0. The code a phone's camera reads the address of an account handed over from.
qrcode = { version = "0.14.1", default-features = false }

# MIT/Apache-2.0. A later version is announced by the system's own notifications; on Linux
# over the zbus already in the tree.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
notify-rust = "4"
# MIT. The system's own dialog for a picture of the user's: the desktop portal on Linux, over
# the zbus already in the tree.
rfd = "0.17.2"

# MIT/Apache-2.0, already in the tree through winit and wgpu. Registers the app's
# notifications under its own name, as Windows otherwise files them under PowerShell, and
# writes its Start menu entry, which search and the taskbar's pins go by.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Registry"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# MIT. The program's mark and name, written into it for Explorer, the taskbar and search.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# MIT. The desktop's media keys and "now playing" widget; over zbus, so nothing to link.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

# MIT/Apache-2.0/Zlib, all already in the tree through winit and wgpu. Lowers macOS's
# window buttons onto the line of the top bar's own.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "ios")'.dependencies]
# eframe's iOS event loop logs startup errors before exiting instead of returning them.
log = "0.4"
raw-window-handle = "0.6.2"
