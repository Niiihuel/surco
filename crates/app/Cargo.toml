[package]
name = "dnmusic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "dnmusic for the desktop: a native music player drawn with limn."

[dependencies]
dnm-core = { path = "../core" }
limn = { path = "../../../lienzo-table/crates/limn", default-features = false }
limn-egui = { path = "../../../lienzo-table/crates/limn-egui", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
# Saves the frame for `--screenshot`, and reads a cover's colors for the tint of its card.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
fastrand = "2"
dnm-audio = { path = "../audio" }
dnm-youtube = { path = "../youtube" }
dnm-video = { path = "../video" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# A cover reaches limn as base64 with its digest.
sha2 = "0.10"
# The index of what is kept for offline listening.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hour of the day, for the greeting. Already in the tree through the catalog.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# Both already in the tree through the HTTP client: a playlist's name inside its link, and
# its tracks fetched side by side when one is opened.
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# MIT. The desktop's media keys and "now playing" widget; over zbus, so nothing to link.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
