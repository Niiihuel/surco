[package]
name = "dnm-youtube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "YouTube Music as a catalog and as a source of audio streams."

[dependencies]
dnm-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "gzip", "brotli", "json"] }
serde_json = "1"
# `join!` for the three searches behind one query.
tokio = { version = "1", features = ["macros", "sync"] }
# MIT. Catalog only; it has no stream extraction.
ytmapi-rs = { version = "=0.3.3", default-features = false, features = ["rustls", "simplified-queries"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
