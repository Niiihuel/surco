[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.17.2"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Niiihuel/surco"

# The oldest version that may keep running. A release carries it in its notes, and the
# builds older than it must take that release in before they go on. 0.12.0 moves an account
# by a short code that older builds cannot read, so every computer has to take it.
[workspace.metadata.surco]
minimum = "0.12.0"

# Thin LTO inlines across crates at a fraction of fat LTO's build time; dropping the
# standard library's debug info saves megabytes while panics still name their functions.
[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"

# Decoding audio and painting frames unoptimized is too slow to judge anything by.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The equaliser and the Opus decoder run per sample on the mixing thread.
[profile.dev.package.surco-audio]
opt-level = 2

# eframe 0.37.0 as published, but for one line: on iOS it sized its surface to the safe area
# while egui lays out over the whole screen, so the picture was stretched and lost its foot.
# Drop it once eframe sizes the surface from the screen there.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
