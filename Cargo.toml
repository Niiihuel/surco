[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Niiihuel/surco"

# The oldest version that may keep running. A release carries it in its notes, and the
# builds older than it must take that release in before they go on.
[workspace.metadata.surco]
minimum = "0.1.0"

# Thin LTO inlines across crates at a fraction of fat LTO's build time; dropping the
# standard library's debug info saves megabytes while panics still name their functions.
[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"

# Decoding audio and painting frames unoptimized is too slow to judge anything by.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The equaliser and the Opus decoder run per sample on the mixing thread.
[profile.dev.package.surco-audio]
opt-level = 2
