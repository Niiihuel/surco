[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[profile.dev]
debug = "line-tables-only"

# Decoding audio and painting frames unoptimized is too slow to judge anything by.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The equaliser and the Opus decoder run per sample on the mixing thread.
[profile.dev.package.dnm-audio]
opt-level = 2
