name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the signed IPA to App Store Connect for TestFlight (otherwise export only)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: surco-testflight
  cancel-in-progress: false

env:
  LIMN_REF: 8446d9f41e0f8b705619a87f2317c4fe8b44008d # floating labels, a display face and stacked areas
  # App Store Connect requires SDK 26+. SDK 27 also requires a UIScene migration.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IPHONEOS_DEPLOYMENT_TARGET: '15.0'
  CARGO_BUILD_JOBS: '3'
  # Empty keeps io.github.niiihuel.surco; a fork sets its own as a repository variable.
  SURCO_BUNDLE_ID: ${{ vars.SURCO_BUNDLE_ID }}

jobs:
  distribute:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: surco

      - name: Check scripts
        working-directory: surco
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Verify the actual Surco app record and supplied profile before compiling Rust.
      - name: Check Apple setup
        working-directory: surco
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/testflight.py --preflight

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Niiihuel/limn
          ref: ${{ env.LIMN_REF }}
          path: lienzo

      - name: Rust and native tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          cmake --version
          ninja --version

      - name: Sign, export and optionally upload
        working-directory: surco
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/testflight.py ${{ inputs.upload && '--upload' || '' }}

      - name: Signed IPA and redacted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surco-testflight
          path: surco/target/testflight/artifacts/
          if-no-files-found: ignore
          retention-days: 7
