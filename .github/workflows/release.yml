name: Release
run-name: Release · ${{ inputs.version || github.ref_name }}

# A tag `v1.2.3` builds the desktop's three systems and Android and publishes them together:
# the app looks for its later versions in these releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, as in Cargo.toml (e.g. 0.2.0). Nothing is published.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The commit of limn the app is built against: limn moves on its own, and a build of
  # the app must not change under it. This is limn's main with a picture whose foot dissolves
  # and corners kept inside a rounded clip.
  LIMN_REF: cb71d6149badd86e00cfb0b73a6528d10fec121a

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, target: linux-x86_64, binary: surco }
          - { name: Windows, os: windows-2022, target: windows-x86_64, binary: surco.exe }
          - { name: macOS, os: macos-26, target: macos-arm64, binary: surco }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: surco

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Niiihuel/limn
          ref: ${{ env.LIMN_REF }}
          path: lienzo

      # The app compares the tag with the version it was built as: they must be the same.
      - name: Version
        id: version
        shell: bash
        working-directory: surco
        env:
          ASKED: ${{ inputs.version }}
        run: |
          version="${ASKED:-${GITHUB_REF_NAME#v}}"
          built=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$built" ]; then
            echo "✗ $version was asked for, but Cargo.toml says $built."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build
        working-directory: surco
        run: cargo build --release --locked -p surco

      - name: Package
        id: package
        shell: bash
        working-directory: surco
        run: |
          name="surco-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/release/${{ matrix.binary }}" LICENSE README.md CHANGELOG.md "$name/"
          cp -r LICENSES "$name/"
          # Beside the package, the program alone: it is what a running app fetches to
          # take this version in by itself.
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            cp "target/release/${{ matrix.binary }}" "$name.exe"
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
            echo "program=$name.exe" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            cp "target/release/${{ matrix.binary }}" "$name.bin"
            rm -r "$name" && mv "$name.bin" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
            echo "program=$name" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            surco/${{ steps.package.outputs.file }}
            surco/${{ steps.package.outputs.program }}
          if-no-files-found: error

  # The phone's and the TV's package, signed with the key every earlier one was: Android
  # installs a version over another only when both carry the same.
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: surco

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Niiihuel/limn
          ref: ${{ env.LIMN_REF }}
          path: lienzo

      - name: Version
        id: version
        working-directory: surco
        env:
          ASKED: ${{ inputs.version }}
        run: |
          version="${ASKED:-${GITHUB_REF_NAME#v}}"
          built=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$built" ]; then
            echo "✗ $version was asked for, but Cargo.toml says $built."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Without the key, a package could not take the place of the one installed.
      - name: Key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "✗ ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set: see docs/android.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/surco.p12"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust library
        working-directory: surco
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh release

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.11.1

      - name: APK
        working-directory: surco
        env:
          SURCO_KEYSTORE: ${{ runner.temp }}/surco.p12
          SURCO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "surco-${{ steps.version.outputs.version }}-android-arm64.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64
          path: surco/surco-*-android-arm64.apk
          if-no-files-found: error

  # All or none: a release with a system missing would tell that system's users of a
  # version they cannot fetch.
  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: surco

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true

      # The sums a running app checks its program against, and in the notes the oldest
      # version that may keep running.
      - name: Release
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum surco-*-linux-x86_64 surco-*-macos-arm64 surco-*-windows-x86_64.exe surco-*-android-arm64.apk > SHA256SUMS
          minimum=$(grep -m1 '^minimum = ' ../surco/Cargo.toml | cut -d'"' -f2)
          notes="$RUNNER_TEMP/surco-release-notes.md"
          printf '<!-- surco:minimum=%s -->\n\n' "$minimum" > "$notes"
          # Only what this version brings: the app shows these notes to whoever it offers it to.
          awk -v heading="## ${GITHUB_REF_NAME#v}" '$0 == heading { on = 1; next } /^## / { on = 0 } on' ../surco/CHANGELOG.md >> "$notes"
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "Surco ${GITHUB_REF_NAME#v}" --notes-file "$notes"
